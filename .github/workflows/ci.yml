name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vet:
    runs-on: [self-hosted, arm64-local]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: mvn -q compile

  test:
    runs-on: [self-hosted, arm64-local]
    needs: vet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: mvn test

  build:
    runs-on: [self-hosted, arm64-local]
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: mvn -DskipTests package

  log-audit-hosted:
    runs-on: ubuntu-latest
    steps:
      - name: Create audit log directory
        run: |
          mkdir -p "$RUNNER_TEMP/ci-audit-logs"
          echo "$(date -u +"%Y-%m-%dT%H:%M:%SZ") run=${{ github.run_id }} runner=${{ runner.name }}" >> "$RUNNER_TEMP/ci-audit-logs/ci.log"
